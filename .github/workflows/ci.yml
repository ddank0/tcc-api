name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tcc
          POSTGRES_USER: tcc
          POSTGRES_PASSWORD: tcc
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # O esquema pertence ao tcc-jobs, que é o dono do Alembic. Aplicá-lo a
      # partir da fonte, e não de um dump versionado aqui, é o que impede a
      # definição de divergir entre os dois repositórios.
      - name: Buscar o esquema no repositório dono
        uses: actions/checkout@v4
        with:
          repository: ddank0/tcc-jobs
          path: .tcc-jobs

      - uses: astral-sh/setup-uv@v5

      - name: Criar banco de teste com o esquema do Alembic
        working-directory: .tcc-jobs
        env:
          DATABASE_URL: postgresql+psycopg://tcc:tcc@localhost:5432/tcc_api_test
          # O Settings do tcc-jobs exige as duas; aqui só a primeira é usada.
          TEST_DATABASE_URL: postgresql+psycopg://tcc:tcc@localhost:5432/tcc_api_test
        run: |
          PGPASSWORD=tcc psql -h localhost -U tcc -d tcc -c "CREATE DATABASE tcc_api_test;"
          uv run alembic upgrade head

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, xml
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formatação
        run: ./vendor/bin/pint --test

      # Nível 10 é o máximo do PHPStan. Larastan é indispensável: sem ele o
      # nível 10 acusa centenas de falsos positivos nas facades e no Eloquent.
      - name: Análise estática (PHPStan nível 10)
        run: php -d memory_limit=1G ./vendor/bin/phpstan analyse --no-progress

      - name: Testes
        run: ./vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tcc_api_test
          DB_USERNAME: tcc
          DB_PASSWORD: tcc

  # O compose de desenvolvimento nunca exercita o estágio prod. Sem este job,
  # um Dockerfile quebrado só apareceria na hora do deploy.
  build-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build do estágio de produção
        run: docker build --target prod -t tcc-api:prod .
      - name: Confirmar que pdo_pgsql está na imagem
        run: docker run --rm tcc-api:prod php -m | grep -q pdo_pgsql
